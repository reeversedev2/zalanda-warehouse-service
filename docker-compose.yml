services:
  warehouse:
    build: .
    environment:
      - DB_USER=${DB_USER:-warehouse_user}
      - DB_PASSWORD=${DB_PASSWORD:-secure_warehouse_password}
      - DB_NAME=${DB_NAME:-ikea_warehouse_db}
      - JWT_SECRET=${JWT_SECRET:-ikea-warehouse-super-secret-jwt-key-2024}
      - PORT=${PORT:-8080}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-ikea_warehouse_db}
      - POSTGRES_USER=${DB_USER:-warehouse_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_warehouse_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-warehouse_user} -d ${DB_NAME:-ikea_warehouse_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-db:
